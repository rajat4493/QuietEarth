name: ProjectStill
options:
  bundleIdPrefix: com.rajatpandey
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ProjectStill:
    type: application
    platform: iOS
    sources:
      - path: ProjectStill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajatpandey.ProjectStill
        PRODUCT_NAME: ProjectStill
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ProjectStill
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ProjectStillTests
        - ProjectStillUITests
  ProjectStillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProjectStillTests
    dependencies:
      - target: ProjectStill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajatpandey.ProjectStillTests
        GENERATE_INFOPLIST_FILE: YES
  ProjectStillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProjectStillUITests
    dependencies:
      - target: ProjectStill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajatpandey.ProjectStillUITests
        GENERATE_INFOPLIST_FILE: YES

